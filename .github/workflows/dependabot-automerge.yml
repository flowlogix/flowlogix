name: "Dependabot Auto Approve and Merge"
permissions: read-all
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 5.x

jobs:
  call-automerge:
    uses: flowlogix/base-pom/.github/workflows/dependabot-automerge.yml@bd1bf127d88f1538383c7ca0e3424c4d0a23310a # v148
    with:
      branches: 'main,5.x'
    permissions:
      checks: read
      pull-requests: write
      contents: write
    secrets:
      github-token: ${{ secrets.GH_AUTOMERGE_TOKEN }}
