name: "Dependabot Auto Approve and Merge"
permissions: read-all
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 5.x

jobs:
  call-automerge:
    uses: flowlogix/base-pom/.github/workflows/dependabot-automerge.yml@5ffd62c771919d69f5989e175afccfc64b64b213 # v150
    with:
      branches: 'main,5.x'
    permissions:
      checks: read
      pull-requests: write
      contents: write
    secrets:
      github-token: ${{ secrets.GH_AUTOMERGE_TOKEN }}
