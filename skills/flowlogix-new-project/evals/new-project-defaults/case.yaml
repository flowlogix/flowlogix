schema_version: "1.1"
name: new-project-defaults
expected_outcome: |
  An orders/ directory generated by start.flowlogix.com (through the flowlogix-starter CLI or the
  download endpoint), with base package com.acme rather than com.example.starter and an executable
  mvnw. The final message names the defaults the project got (at least the parent POM and the
  packaging), read from the generated project rather than from memory, and how to verify it.
