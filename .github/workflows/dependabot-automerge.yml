name: "Dependabot Auto Approve and Merge"
permissions: read-all
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 5.x

jobs:
  call-automerge:
    uses: flowlogix/base-pom/.github/workflows/dependabot-automerge.yml@6ead2c114dba0389ab22414b94dbd4e6d843527f # v149
    with:
      branches: 'main,5.x'
    permissions:
      checks: read
      pull-requests: write
      contents: write
    secrets:
      github-token: ${{ secrets.GH_AUTOMERGE_TOKEN }}
