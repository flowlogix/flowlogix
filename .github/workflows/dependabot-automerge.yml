name: "Dependabot Auto Approve and Merge"
permissions: read-all
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 5.x

jobs:
  call-automerge:
    uses: flowlogix/base-pom/.github/workflows/dependabot-automerge.yml@37aad2bc64cd7d4a97504dc4fedac39317ef24da # v147
    with:
      branches: 'main,5.x'
    permissions:
      checks: read
      pull-requests: write
      contents: write
    secrets:
      github-token: ${{ secrets.GH_AUTOMERGE_TOKEN }}
